name: Codex PR Review (OpenAI or Bedrock)
description: >-
  Review pull requests with Codex's native reviewer on OpenAI models, through
  the OpenAI API or Amazon Bedrock (GitHub OIDC), and post an issues list with
  file:line links plus inline comments.
author: Piyush Gambhir
branding:
  icon: eye
  color: purple

inputs:
  # Model and provider
  provider:
    description: "Where the model runs: `openai` (OpenAI API key) or `bedrock` (Amazon Bedrock via GitHub OIDC)."
    default: openai
  model:
    description: "Model ID. Empty picks the provider default: `gpt-6.1-sol` for openai, `us.openai.gpt-6-sol` for bedrock."
    default: ""
  reasoning-effort:
    description: "Codex reasoning effort: low, medium, high or xhigh."
    default: medium
  openai-api-key:
    description: "OpenAI API key. Required when provider is `openai`."
    default: ""
  aws-role-to-assume:
    description: "IAM role ARN trusted for this repository's GitHub OIDC tokens. Required when provider is `bedrock`."
    default: ""
  aws-region:
    description: "AWS region for Bedrock."
    default: us-east-1
  bedrock-endpoint:
    description: "Codex's Bedrock provider: `amazon-bedrock-runtime` (inference profiles such as `us.openai.gpt-6-sol`) or `amazon-bedrock` (Mantle, in-region IDs such as `openai.gpt-6-sol`)."
    default: amazon-bedrock-runtime

  # What to review
  base-ref:
    description: "Git ref to review against, e.g. `origin/main`. Must exist in the checkout (use `fetch-depth: 0`)."
    required: true
  pr-number:
    description: "Pull request number to post on."
    required: true
  head-sha:
    description: "Commit SHA the review is anchored to (the checked-out PR head)."
    required: true
  working-directory:
    description: "Path of the PR checkout, relative to the workspace."
    default: .
  include-paths:
    description: "Only report findings in files matching these glob patterns (newline or comma separated, `**` supported). Empty reports every file."
    default: ""
  exclude-paths:
    description: "Never report findings in files matching these glob patterns; Codex is told to skip them as well."
    default: ""
  max-changed-lines:
    description: "Added plus deleted lines (merge base to HEAD, after the path filters) above which `large-pr` applies. Empty means no limit."
    default: ""
  large-pr:
    description: "Over `max-changed-lines`: `warn` (review anyway and note it) or `skip` (post a note and skip the review)."
    default: warn

  # Review behaviour
  review-instructions:
    description: "Extra review guidelines for Codex, e.g. what to prioritise or ignore in this repository."
    default: ""
  review-instructions-file:
    description: "Path (relative to the workspace) of a Markdown file with review guidelines. Load it from a trusted checkout, not the PR."
    default: ""
  suggestions:
    description: "Ask Codex to include small, self-contained fixes as GitHub suggestions that can be committed straight from the review."
    default: "true"
  max-priority:
    description: "Lowest priority to report: P0 (critical only) to P3 (everything)."
    default: P3
  fail-on-priority:
    description: "Fail the step when a reported finding is at this priority or higher, e.g. `P1`. Empty never fails on findings."
    default: ""

  # Output
  post-mode:
    description: "`review` (issues table plus inline comments), `comment` (one comment with the issues table) or `none` (outputs and job summary only)."
    default: review
  hide-previous:
    description: "Collapse earlier Codex comments on the PR as outdated before posting."
    default: "true"
  title:
    description: "Heading for the posted review."
    default: Codex review
  status-comment:
    description: "Post an \"in progress\" note while reviewing, replaced by the review, or turned into a failure note with the reason and run link."
    default: "true"
  trigger-comment-id:
    description: "ID of the comment that requested the review; it gets a rocket reaction on success and a confused one on failure."
    default: ""
  rerun-hint:
    description: "Next-steps line shown under the review, e.g. how to re-run it. Empty shows nothing."
    default: ""
  github-token:
    description: "Token used to post (needs `pull-requests: write`). Use a GitHub App token to post under your own bot name and avatar."
    default: ${{ github.token }}

  # Advanced
  sandbox:
    description: "Codex sandbox for commands it runs while reviewing (`read-only` recommended)."
    default: read-only
  codex-config:
    description: "Extra raw TOML appended to the generated Codex config.toml (top-level keys or tables)."
    default: ""
  codex-version:
    description: "Pinned `@openai/codex` version."
    default: "0.159.1"

outputs:
  findings-count:
    description: "Number of findings reported (after max-priority filtering)."
    value: ${{ steps.publish.outputs.findings-count }}
  highest-priority:
    description: "Highest reported priority, e.g. `P1`; empty when there are no findings."
    value: ${{ steps.publish.outputs.highest-priority }}
  filtered-count:
    description: "Findings hidden by max-priority."
    value: ${{ steps.publish.outputs.filtered-count }}
  path-filtered-count:
    description: "Findings hidden by include-paths or exclude-paths."
    value: ${{ steps.publish.outputs.path-filtered-count }}
  changed-lines:
    description: "Added plus deleted lines between the merge base and HEAD, after the path filters."
    value: ${{ steps.guard.outputs.changed-lines }}
  findings-file:
    description: "Path of a JSON file with the reported findings (priority, title, path, start, end, body, suggestion)."
    value: ${{ steps.publish.outputs.findings-file }}
  review-file:
    description: "Path of Codex's raw final review message."
    value: ${{ steps.review.outputs.review-file }}

runs:
  using: composite
  steps:
    - name: Resolve provider settings
      id: settings
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        BEDROCK_ENDPOINT: ${{ inputs.bedrock-endpoint }}
        HAS_OPENAI_KEY: ${{ inputs.openai-api-key != '' }}
        HAS_AWS_ROLE: ${{ inputs.aws-role-to-assume != '' }}
      run: |
        case "$PROVIDER" in
          openai)
            [ "$HAS_OPENAI_KEY" = "true" ] || { echo "::error::provider openai needs the openai-api-key input."; exit 1; }
            codex_provider="openai"
            model="${MODEL:-gpt-6.1-sol}"
            label="OpenAI API"
            ;;
          bedrock)
            [ "$HAS_AWS_ROLE" = "true" ] || { echo "::error::provider bedrock needs the aws-role-to-assume input."; exit 1; }
            codex_provider="$BEDROCK_ENDPOINT"
            model="${MODEL:-us.openai.gpt-6-sol}"
            label="Amazon Bedrock"
            ;;
          *)
            echo "::error::Unknown provider '$PROVIDER' (use openai or bedrock)."
            exit 1
            ;;
        esac
        echo "Provider: $PROVIDER ($codex_provider), model: $model"
        {
          echo "codex-provider=$codex_provider"
          echo "model=$model"
          echo "label=$label"
        } >> "$GITHUB_OUTPUT"

    # Runs before anything is installed or posted, so an oversized pull request
    # costs nothing beyond one `git diff --numstat`.
    - name: Check pull request size
      id: guard
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        INCLUDE_PATHS: ${{ inputs.include-paths }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}
        LARGE_PR: ${{ inputs.large-pr }}
        POST_MODE: ${{ inputs.post-mode }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/filters.py"
        if [ "$(sed -n 's/^skip=//p' "$GITHUB_OUTPUT" | tail -1)" = "true" ]; then
          echo "::warning::Skipping the review: the pull request is over max-changed-lines."
          if [ "$POST_MODE" != "none" ]; then
            CHANGED_LINES="$(sed -n 's/^changed-lines=//p' "$GITHUB_OUTPUT" | tail -1)" \
              python3 "$GITHUB_ACTION_PATH/scripts/status.py" skip
          fi
        fi

    - name: Post progress note
      id: status
      if: steps.guard.outputs.skip != 'true' && inputs.post-mode != 'none' && inputs.status-comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" start

    # Installed into RUNNER_TEMP with install scripts disabled, so nothing from
    # the pull request can influence the reviewer binary.
    - name: Install Codex CLI
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: |
        npm install --prefix "$RUNNER_TEMP/codex-cli" \
          --ignore-scripts --no-audit --no-fund \
          --registry=https://registry.npmjs.org/ \
          "@openai/codex@$CODEX_VERSION"
        "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" --version

    # Credentials are returned as outputs, not exported to the job, so only the
    # review step below ever sees them.
    - name: Assume the Bedrock role (OIDC)
      id: aws
      if: steps.guard.outputs.skip != 'true' && inputs.provider == 'bedrock'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: codex-review-${{ github.run_id }}
        role-duration-seconds: 3600
        output-env-credentials: false
        output-credentials: true

    - name: Write Codex config
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        CODEX_HOME: ${{ runner.temp }}/codex-home
        CODEX_PROVIDER: ${{ steps.settings.outputs.codex-provider }}
        MODEL: ${{ steps.settings.outputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        SANDBOX: ${{ inputs.sandbox }}
        REVIEW_INSTRUCTIONS: ${{ inputs.review-instructions }}
        REVIEW_INSTRUCTIONS_FILE: ${{ inputs.review-instructions-file }}
        CODEX_CONFIG: ${{ inputs.codex-config }}
        SUGGESTIONS: ${{ inputs.suggestions }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/write_config.py"

    - name: Run Codex review
      id: review
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Only the selected provider's credentials are set; the others are empty.
        CODEX_API_KEY: ${{ inputs.provider == 'openai' && inputs.openai-api-key || '' }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        CODEX_HOME: ${{ runner.temp }}/codex-home
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        review_file="$RUNNER_TEMP/codex-review.md"
        events_file="$RUNNER_TEMP/codex-review-events.jsonl"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"
        status=0
        "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" exec review \
          --base "$BASE_REF" --ephemeral --json -o "$review_file" \
          < /dev/null > "$events_file" || status=$?

        # Surface errors (skipping retry noise) and any reported token usage.
        jq -r 'select((.type == "error" or .type == "turn.failed") and ((.message // "") | startswith("Reconnecting") | not)) | "::error::Codex: \(.message // .error.message // tostring)"' "$events_file" | sort -u || true
        usage=$(jq -c 'select(.type == "turn.completed") | .usage' "$events_file" | tail -1)
        echo "Codex exit: $status, usage: ${usage:-none}"
        # Codex's review mode currently reports zero usage; only show real counts.
        if [ -n "$usage" ] && [ "$(jq '.input_tokens + .output_tokens' <<<"$usage")" -gt 0 ]; then
          jq -r '"usage-text=\(.input_tokens) input (\(.cached_input_tokens) cached) + \(.output_tokens) output tokens"' <<<"$usage" >> "$GITHUB_OUTPUT"
        fi

        if [ "$status" -ne 0 ] || [ ! -s "$review_file" ]; then
          echo "::error::Codex review failed or produced no output (exit $status)."
          exit 1
        fi

    - name: Publish review
      id: publish
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        REVIEW_FILE: ${{ steps.review.outputs.review-file }}
        REVIEW_WORKSPACE: ${{ github.workspace }}/${{ inputs.working-directory }}
        USAGE_TEXT: ${{ steps.review.outputs.usage-text }}
        POST_MODE: ${{ inputs.post-mode }}
        HIDE_PREVIOUS: ${{ inputs.hide-previous }}
        MAX_PRIORITY: ${{ inputs.max-priority }}
        FAIL_ON_PRIORITY: ${{ inputs.fail-on-priority }}
        SUGGESTIONS: ${{ inputs.suggestions }}
        INCLUDE_PATHS: ${{ inputs.include-paths }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        SIZE_NOTE: ${{ steps.guard.outputs.note }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/publish_review.py"

    # The review is posted even when fail-on-priority fails the step above, so
    # the progress note is cleared whenever a review actually went up.
    - name: Clear progress note
      if: always() && steps.publish.outputs.posted == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        TRIGGER_COMMENT_ID: ${{ inputs.trigger-comment-id }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" done

    - name: Report failure on the PR
      if: failure() && steps.publish.outputs.posted != 'true' && inputs.post-mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        TRIGGER_COMMENT_ID: ${{ inputs.trigger-comment-id }}
        EVENTS_FILE: ${{ runner.temp }}/codex-review-events.jsonl
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" fail
