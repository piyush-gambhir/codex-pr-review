name: Codex PR Review (OpenAI or Bedrock)
description: >-
  Review pull requests with Codex's native reviewer on OpenAI models, through
  the OpenAI API or Amazon Bedrock (GitHub OIDC), and post an issues list with
  file:line links plus inline comments.
author: Piyush Gambhir

inputs:
  # Model and provider
  provider:
    description: "Where the model runs: `openai` (OpenAI API key) or `bedrock` (Amazon Bedrock via GitHub OIDC)."
    default: openai
  model:
    description: "Model ID. Empty picks the provider default: `gpt-6.1-sol` for openai, `us.openai.gpt-6-sol` for bedrock."
    default: ""
  reasoning-effort:
    description: "Codex reasoning effort: low, medium, high or xhigh."
    default: medium
  openai-api-key:
    description: "OpenAI API key. Required when provider is `openai`."
    default: ""
  aws-role-to-assume:
    description: "IAM role ARN trusted for this repository's GitHub OIDC tokens. Required when provider is `bedrock`."
    default: ""
  aws-region:
    description: "AWS region for Bedrock."
    default: us-east-1
  bedrock-endpoint:
    description: "Codex's Bedrock provider: `amazon-bedrock-runtime` (inference profiles such as `us.openai.gpt-6-sol`) or `amazon-bedrock` (Mantle, in-region IDs such as `openai.gpt-6-sol`)."
    default: amazon-bedrock-runtime

  # What to review
  base-ref:
    description: "Git ref to review against, e.g. `origin/main`. Must exist in the checkout (use `fetch-depth: 0`)."
    required: true
  pr-number:
    description: "Pull request number to post on."
    required: true
  head-sha:
    description: "Commit SHA the review is anchored to (the checked-out PR head)."
    required: true
  working-directory:
    description: "Path of the PR checkout, relative to the workspace."
    default: .
  include-paths:
    description: "Only report findings in files matching these glob patterns (newline or comma separated, `**` supported). Empty reports every file."
    default: ""
  exclude-paths:
    description: "Never report findings in files matching these glob patterns; Codex is told to skip them as well."
    default: ""
  max-changed-lines:
    description: "Added plus deleted lines (merge base to HEAD, after the path filters) above which `large-pr` applies. Empty means no limit."
    default: ""
  large-pr:
    description: "Over `max-changed-lines`: `warn` (review anyway and note it) or `skip` (post a note and skip the review)."
    default: warn

  # Review behaviour
  review-instructions:
    description: "Extra review guidelines for Codex, e.g. what to prioritise or ignore in this repository."
    default: ""
  review-instructions-file:
    description: "Path (relative to the workspace) of a Markdown file with review guidelines. Load it from a trusted checkout, not the PR."
    default: ""
  suggestions:
    description: "Ask Codex to include small, self-contained fixes as GitHub suggestions that can be committed straight from the review."
    default: "true"
  max-priority:
    description: "Lowest priority to report: P0 (critical only) to P3 (everything)."
    default: P3
  fail-on-priority:
    description: "Fail the step when a reported finding is at this priority or higher, e.g. `P1`. Empty never fails on findings."
    default: ""
  resolve-fixed-threads:
    description: "Resolve the inline threads of findings the new review no longer reports. Best effort; never fails the review."
    default: "true"
  incremental:
    description: "Review only the commits pushed since the last Codex review on this pull request. Falls back to a full review when that commit is no longer in the branch's history."
    default: "false"
  skip-unchanged:
    description: "Skip the review when the last Codex review on this pull request already covers this commit with these settings; a short note links to it instead of calling the model again."
    default: "true"
  force:
    description: "Review even when `skip-unchanged` would skip, e.g. because the request asked for a fresh review with `force`."
    default: "false"

  # Output
  post-mode:
    description: "`review` (issues table plus inline comments), `comment` (one comment with the issues table) or `none` (outputs and job summary only)."
    default: review
  hide-previous:
    description: "Collapse earlier Codex comments on the PR as outdated before posting."
    default: "true"
  title:
    description: "Heading for the posted review."
    default: Codex review
  status-comment:
    description: "Post an \"in progress\" note while reviewing, replaced by the review, or turned into a failure note with the reason and run link."
    default: "true"
  trigger-comment-id:
    description: "ID of the comment that requested the review; it gets a rocket reaction on success and a confused one on failure."
    default: ""
  rerun-hint:
    description: "Next-steps line shown under the review, e.g. how to re-run it. Empty shows nothing."
    default: ""
  icons:
    description: "Show the small Octicon images from `icons/` in the review, the status notes and the check run. `false` renders every layout as text only, with no external images (for GitHub Enterprise Server or locked-down organisations)."
    default: "true"
  icon-base-url:
    description: "Base URL the icon images are loaded from, without a trailing slash. Empty serves them from jsDelivr for this action's own repository at its released ref."
    default: ""
  check-run:
    description: "Create a check run named after `title` on the reviewed commit, with the verdict and one annotation per finding. Needs `checks: write`."
    default: "false"
  sarif-file:
    description: "Path to also write the findings to as SARIF 2.1.0, for `github/codeql-action/upload-sarif`. Empty writes nothing."
    default: ""
  github-token:
    description: "Token used to post (needs `pull-requests: write`). Use a GitHub App token to post under your own bot name and avatar."
    default: ${{ github.token }}

  # Advanced
  pricing:
    description: "JSON override for the built-in price table, per 1M tokens as `{\"model\": [input, cached-input, output]}`, e.g. `{\"my-model\": [2, 0.2, 10]}`."
    default: ""
  sandbox:
    description: "Codex sandbox for commands it runs while reviewing (`read-only` recommended)."
    default: read-only
  codex-config:
    description: "Extra raw TOML appended to the generated Codex config.toml (top-level keys or tables)."
    default: ""
  codex-version:
    description: "`@openai/codex` version to install: a pinned version (reproducible, the default) or `latest` (newest release that has passed pnpm's minimum release age)."
    default: "0.159.2"
  node-version:
    description: "Node.js version to set up for installing and running Codex (`actions/setup-node`). Empty uses the runner's Node as is; an open request such as `lts/*` is skipped when the runner's Node already satisfies it."
    default: lts/*
  pnpm-version:
    description: "pnpm version to set up (`pnpm/action-setup`) for installing Codex. Skipped when the runner already has that pnpm and its Node is being kept."
    default: "12"
  cache-install:
    description: "Cache the installed Codex CLI with `actions/cache`, keyed on the runner, the resolved Codex version and the pnpm major. Turn off on runners with no cache service."
    default: "true"

outputs:
  findings-count:
    description: "Number of findings reported (after max-priority filtering)."
    value: ${{ steps.publish.outputs.findings-count }}
  highest-priority:
    description: "Highest reported priority, e.g. `P1`; empty when there are no findings."
    value: ${{ steps.publish.outputs.highest-priority }}
  filtered-count:
    description: "Findings hidden by max-priority."
    value: ${{ steps.publish.outputs.filtered-count }}
  resolved-count:
    description: "Previous findings no longer reported (fixed since the last Codex review)."
    value: ${{ steps.publish.outputs.resolved-count }}
  path-filtered-count:
    description: "Findings hidden by include-paths or exclude-paths."
    value: ${{ steps.publish.outputs.path-filtered-count }}
  changed-lines:
    description: "Added plus deleted lines between the merge base and HEAD, after the path filters."
    value: ${{ steps.guard.outputs.changed-lines }}
  findings-file:
    description: "Path of a JSON file with the reported findings (priority, title, path, start, end, body, suggestion)."
    value: ${{ steps.publish.outputs.findings-file }}
  review-file:
    description: "Path of Codex's raw final review message."
    value: ${{ steps.review.outputs.review-file }}
  input-tokens:
    description: "Input tokens the review used (cached ones included); empty when Codex reported no usage."
    value: ${{ steps.usage.outputs.input-tokens }}
  cached-input-tokens:
    description: "Input tokens served from the prompt cache."
    value: ${{ steps.usage.outputs.cached-input-tokens }}
  output-tokens:
    description: "Output tokens the review used, reasoning tokens included."
    value: ${{ steps.usage.outputs.output-tokens }}
  estimated-cost-usd:
    description: "Estimated cost in US dollars from the built-in price table; empty when the model has no known price."
    value: ${{ steps.usage.outputs.estimated-cost-usd }}
  sarif-file:
    description: "Path of the SARIF 2.1.0 file; empty unless the sarif-file input was set."
    value: ${{ steps.sarif.outputs.sarif-file }}
  check-run-id:
    description: "ID of the check run, when check-run is enabled and creating it succeeded."
    value: ${{ steps.check.outputs.check-run-id }}
  skipped:
    description: "`true` when no review ran: the pull request was over `max-changed-lines`, or this commit already had one."
    value: ${{ (steps.guard.outputs.skip == 'true' || steps.rereview.outputs.skipped == 'true') && 'true' || 'false' }}
  skip-reason:
    description: "Why no review ran: `large-pr`, `already-reviewed`, or empty when it ran."
    value: ${{ steps.guard.outputs.skip == 'true' && 'large-pr' || steps.rereview.outputs.skip-reason }}
  existing-review-url:
    description: "The review a skipped run pointed at, when `skip-reason` is `already-reviewed`."
    value: ${{ steps.rereview.outputs.review-url }}

runs:
  using: composite
  steps:
    - name: Resolve provider settings
      id: settings
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        BEDROCK_ENDPOINT: ${{ inputs.bedrock-endpoint }}
        HAS_OPENAI_KEY: ${{ inputs.openai-api-key != '' }}
        HAS_AWS_ROLE: ${{ inputs.aws-role-to-assume != '' }}
      run: |
        case "$PROVIDER" in
          openai)
            [ "$HAS_OPENAI_KEY" = "true" ] || { echo "::error::provider openai needs the openai-api-key input."; exit 1; }
            codex_provider="openai"
            model="${MODEL:-gpt-6.1-sol}"
            label="OpenAI API"
            ;;
          bedrock)
            [ "$HAS_AWS_ROLE" = "true" ] || { echo "::error::provider bedrock needs the aws-role-to-assume input."; exit 1; }
            codex_provider="$BEDROCK_ENDPOINT"
            model="${MODEL:-us.openai.gpt-6-sol}"
            label="Amazon Bedrock"
            ;;
          *)
            echo "::error::Unknown provider '$PROVIDER' (use openai or bedrock)."
            exit 1
            ;;
        esac
        echo "Provider: $PROVIDER ($codex_provider), model: $model"
        {
          echo "codex-provider=$codex_provider"
          echo "model=$model"
          echo "label=$label"
        } >> "$GITHUB_OUTPUT"

    # Runs before anything is installed or posted, so an oversized pull request
    # costs nothing beyond one `git diff --numstat`.
    - name: Check pull request size
      id: guard
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        INCLUDE_PATHS: ${{ inputs.include-paths }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}
        LARGE_PR: ${{ inputs.large-pr }}
        POST_MODE: ${{ inputs.post-mode }}
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/filters.py"
        if [ "$(sed -n 's/^skip=//p' "$GITHUB_OUTPUT" | tail -1)" = "true" ]; then
          echo "::warning::Skipping the review: the pull request is over max-changed-lines."
          if [ "$POST_MODE" != "none" ]; then
            CHANGED_LINES="$(sed -n 's/^changed-lines=//p' "$GITHUB_OUTPUT" | tail -1)" \
              python3 "$GITHUB_ACTION_PATH/scripts/status.py" skip
          fi
        fi

    # Reads the state marker in the last Codex review on this pull request, so
    # this run can report what got fixed and, with `incremental`, review only
    # the commits pushed since then. It runs before anything is posted, so the
    # whole conversation is read once (one GraphQL call), and what the steps
    # below need from it - the comments to collapse, the threads to resolve -
    # travels in the plan file instead of being listed again.
    - name: Read the previous review
      id: history
      if: steps.guard.outputs.skip != 'true' && inputs.post-mode != 'none'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        INCREMENTAL: ${{ inputs.incremental }}
        STATE_FILE: ${{ runner.temp }}/codex-review-state.json
      run: python3 "$GITHUB_ACTION_PATH/scripts/history.py" plan

    # Nothing has been installed or posted yet, so a commit that already has a
    # review with these settings costs one GraphQL call and one comment.
    - name: Skip an unchanged re-review
      id: rereview
      if: steps.guard.outputs.skip != 'true' && inputs.post-mode != 'none' && inputs.skip-unchanged == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        TRIGGER_COMMENT_ID: ${{ inputs.trigger-comment-id }}
        STATE_FILE: ${{ runner.temp }}/codex-review-state.json
        SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        FORCE: ${{ inputs.force }}
        # The settings the digest covers; publish_review.py writes it from the
        # same variables, so the two must stay in step.
        INCREMENTAL: ${{ inputs.incremental }}
        SUGGESTIONS: ${{ inputs.suggestions }}
        MAX_PRIORITY: ${{ inputs.max-priority }}
        POST_MODE: ${{ inputs.post-mode }}
        INCLUDE_PATHS: ${{ inputs.include-paths }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        REVIEW_INSTRUCTIONS: ${{ inputs.review-instructions }}
        REVIEW_INSTRUCTIONS_FILE: ${{ inputs.review-instructions-file }}
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/rereview.py" check

    - name: Post progress note
      id: status
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true' && inputs.post-mode != 'none' && inputs.status-comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" start

    # Created in progress so it shows in the PR's checks while Codex reviews,
    # and completed after publishing. With GITHUB_TOKEN it joins this
    # workflow's own check suite instead of getting a suite of its own.
    - name: Start check run
      id: check
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true' && inputs.check-run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/checks.py" start

    # Installing Codex is the slow part of a run that is not the model call, and
    # most of it is avoidable. The steps below try, in order: the install this
    # runner (or the cache) already has, then the two setup actions and a real
    # install. With the pinned codex-version and a warm cache, nothing but the
    # restore runs.
    - name: Check the runner's Node and pnpm
      id: runtime
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true'
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        node_current=""
        pnpm_current=""
        if command -v node > /dev/null 2>&1; then node_current="$(node --version || true)"; fi
        if command -v pnpm > /dev/null 2>&1; then pnpm_current="$(pnpm --version || true)"; fi
        NODE_CURRENT="$node_current" PNPM_CURRENT="$pnpm_current" \
          python3 "$GITHUB_ACTION_PATH/scripts/install_plan.py" probe

    # A pinned codex-version names its own cache key, with no pnpm needed to work
    # it out, so the restore below can happen before anything is set up. Anything
    # floating (`latest`, a range) leaves both outputs empty and is resolved
    # further down, once pnpm is there to answer.
    - name: Cache key for a pinned Codex version
      id: pinned
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true'
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        if python3 "$GITHUB_ACTION_PATH/scripts/install_plan.py" exact; then
          python3 "$GITHUB_ACTION_PATH/scripts/install_plan.py" key
        else
          echo "codex-version '$CODEX_VERSION' is resolved after pnpm is set up."
          { echo "codex-version="; echo "cache-key="; } >> "$GITHUB_OUTPUT"
        fi

    # Restore only: the install is saved below as soon as it exists, so a failed
    # or cancelled review still leaves the cache warm for the next run.
    - name: Restore the Codex CLI install
      id: codex-cache
      if: inputs.cache-install == 'true' && steps.pinned.outputs.cache-key != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/codex-cli
        key: ${{ steps.pinned.outputs.cache-key }}

    # Whatever is in RUNNER_TEMP now (restored, or still there on a self-hosted
    # runner) is only used when it runs and reports the version this run asked
    # for. That it ran is also what makes the setup steps below unnecessary: the
    # runner's Node just launched the reviewer, which is all Node is here for.
    - name: Is a usable Codex CLI already here?
      id: ready
      if: steps.pinned.outputs.codex-version != ''
      shell: bash
      env:
        CODEX_VERSION: ${{ steps.pinned.outputs.codex-version }}
      run: |
        codex="$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"
        if [ -x "$codex" ] && "$codex" --version 2> /dev/null | grep -qF "$CODEX_VERSION"; then
          echo "Codex $CODEX_VERSION is here and runs; no Node, pnpm or install needed."
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "No usable Codex $CODEX_VERSION here yet."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi

    # `node-version: ''` has always meant "keep the runner's Node", and an open
    # request such as `lts/*` is satisfied by any recent one. pnpm is only kept
    # when Node is kept too, since a pnpm installed against the runner's own Node
    # cannot be trusted once setup-node replaces it.
    - name: Set up Node.js
      if: steps.runtime.outputs.setup-node == 'true' && steps.ready.outputs.ready != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up pnpm
      if: steps.runtime.outputs.setup-pnpm == 'true' && steps.ready.outputs.ready != 'true'
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    # The cache key has to name the version that will actually be installed, and
    # for a floating one only pnpm can say which that is: its minimum release age,
    # a supply-chain delay, means `latest` is usually not the newest published
    # release. Resolution reads the registry's metadata and downloads nothing.
    - name: Resolve a floating Codex version
      id: resolved
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true' && steps.pinned.outputs.cache-key == '' && steps.ready.outputs.ready != 'true'
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        resolve="$RUNNER_TEMP/codex-resolve"
        rm -rf "$resolve"
        mkdir -p "$resolve"
        pnpm --dir "$resolve" add --lockfile-only --ignore-scripts \
          --registry=https://registry.npmjs.org/ \
          "@openai/codex@$CODEX_VERSION" > /dev/null
        LOCKFILE="$resolve/pnpm-lock.yaml" python3 "$GITHUB_ACTION_PATH/scripts/install_plan.py" key

    - name: Restore the Codex CLI install (resolved version)
      id: codex-cache-resolved
      if: inputs.cache-install == 'true' && steps.resolved.outputs.cache-key != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/codex-cli
        key: ${{ steps.resolved.outputs.cache-key }}

    # Installed into RUNNER_TEMP with install scripts disabled, so nothing from
    # the pull request can influence the reviewer binary. pnpm installs the
    # platform binary through Codex's optional dependencies. The version check is
    # repeated here for the restore above, which a floating version only reaches
    # at this point.
    - name: Install Codex CLI
      id: install
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true' && steps.ready.outputs.ready != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        CODEX_VERSION: ${{ steps.pinned.outputs.codex-version || steps.resolved.outputs.codex-version }}
      run: |
        codex="$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"
        if [ -x "$codex" ] && "$codex" --version 2> /dev/null | grep -qF "$CODEX_VERSION"; then
          echo "Codex $CODEX_VERSION is already installed; skipping the install."
          echo "reused=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rm -rf "$RUNNER_TEMP/codex-cli"
        mkdir -p "$RUNNER_TEMP/codex-cli"
        pnpm --dir "$RUNNER_TEMP/codex-cli" add --ignore-scripts \
          --registry=https://registry.npmjs.org/ \
          "@openai/codex@$CODEX_VERSION"
        "$codex" --version
        echo "reused=false" >> "$GITHUB_OUTPUT"

    # Errors here are only warnings (a key another run saved first, no cache
    # service), so a review is never lost to the cache.
    - name: Save the Codex CLI install
      if: steps.install.outputs.reused == 'false' && inputs.cache-install == 'true' && (steps.pinned.outputs.cache-key || steps.resolved.outputs.cache-key) != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/codex-cli
        key: ${{ steps.pinned.outputs.cache-key || steps.resolved.outputs.cache-key }}

    # Credentials are returned as outputs, not exported to the job, so only the
    # review step below ever sees them.
    - name: Assume the Bedrock role (OIDC)
      id: aws
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true' && inputs.provider == 'bedrock'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: codex-review-${{ github.run_id }}
        role-duration-seconds: 3600
        output-env-credentials: false
        output-credentials: true

    - name: Write Codex config
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true'
      shell: bash
      env:
        CODEX_HOME: ${{ runner.temp }}/codex-home
        CODEX_PROVIDER: ${{ steps.settings.outputs.codex-provider }}
        MODEL: ${{ steps.settings.outputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        SANDBOX: ${{ inputs.sandbox }}
        REVIEW_INSTRUCTIONS: ${{ inputs.review-instructions }}
        REVIEW_INSTRUCTIONS_FILE: ${{ inputs.review-instructions-file }}
        CODEX_CONFIG: ${{ inputs.codex-config }}
        SUGGESTIONS: ${{ inputs.suggestions }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/write_config.py"

    - name: Run Codex review
      id: review
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Only the selected provider's credentials are set; the others are empty.
        CODEX_API_KEY: ${{ inputs.provider == 'openai' && inputs.openai-api-key || '' }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        CODEX_HOME: ${{ runner.temp }}/codex-home
        BASE_REF: ${{ steps.history.outputs.review-base || inputs.base-ref }}
      run: |
        review_file="$RUNNER_TEMP/codex-review.md"
        events_file="$RUNNER_TEMP/codex-review-events.jsonl"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"
        status=0
        # Not --ephemeral: the session rollout under $CODEX_HOME/sessions is the
        # only place the real token counts appear, and CODEX_HOME is a temp dir
        # thrown away with the runner.
        "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" exec review \
          --base "$BASE_REF" --json -o "$review_file" \
          < /dev/null > "$events_file" || status=$?

        # Surface errors, skipping retry noise.
        jq -r 'select((.type == "error" or .type == "turn.failed") and ((.message // "") | startswith("Reconnecting") | not)) | "::error::Codex: \(.message // .error.message // tostring)"' "$events_file" | sort -u || true
        echo "Codex exit: $status"

        if [ "$status" -ne 0 ] || [ ! -s "$review_file" ]; then
          echo "::error::Codex review failed or produced no output (exit $status)."
          exit 1
        fi

    # Review mode reports zero usage on turn.completed, so the real counts come
    # from the session rollout Codex just wrote.
    - name: Measure token usage and cost
      id: usage
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true'
      shell: bash
      env:
        CODEX_HOME: ${{ runner.temp }}/codex-home
        MODEL: ${{ steps.settings.outputs.model }}
        PRICING: ${{ inputs.pricing }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/usage.py"

    - name: Publish review
      id: publish
      if: steps.guard.outputs.skip != 'true' && steps.rereview.outputs.skipped != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        REVIEW_FILE: ${{ steps.review.outputs.review-file }}
        REVIEW_WORKSPACE: ${{ github.workspace }}/${{ inputs.working-directory }}
        USAGE_TEXT: ${{ steps.usage.outputs.usage-text }}
        POST_MODE: ${{ inputs.post-mode }}
        HIDE_PREVIOUS: ${{ inputs.hide-previous }}
        MAX_PRIORITY: ${{ inputs.max-priority }}
        FAIL_ON_PRIORITY: ${{ inputs.fail-on-priority }}
        SUMMARY_FILE: ${{ runner.temp }}/codex-review-summary.md
        RESOLVE_FIXED_THREADS: ${{ inputs.resolve-fixed-threads }}
        STATE_FILE: ${{ runner.temp }}/codex-review-state.json
        PREVIOUS_SHA: ${{ steps.history.outputs.previous-sha }}
        INCREMENTAL_NOTE: ${{ steps.history.outputs.note }}
        SUGGESTIONS: ${{ inputs.suggestions }}
        INCLUDE_PATHS: ${{ inputs.include-paths }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        SIZE_NOTE: ${{ steps.guard.outputs.note }}
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
        # The settings digest the posted review carries, so the next run can tell
        # whether asking again could say anything new. Same variables as the
        # skip-unchanged step above.
        PROVIDER: ${{ inputs.provider }}
        INCREMENTAL: ${{ inputs.incremental }}
        REVIEW_INSTRUCTIONS: ${{ inputs.review-instructions }}
        REVIEW_INSTRUCTIONS_FILE: ${{ inputs.review-instructions-file }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/publish_review.py"

    # The review is posted even when fail-on-priority fails the step above, so
    # the progress note is cleared whenever a review actually went up.
    - name: Clear progress note
      if: always() && steps.publish.outputs.posted == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        TRIGGER_COMMENT_ID: ${{ inputs.trigger-comment-id }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" done

    # Written even when fail-on-priority failed the publish step, so the
    # findings can still be uploaded to code scanning.
    - name: Write SARIF
      id: sarif
      if: always() && inputs.sarif-file != '' && steps.publish.outputs.findings-file != ''
      shell: bash
      env:
        FINDINGS_FILE: ${{ steps.publish.outputs.findings-file }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        REVIEW_TITLE: ${{ inputs.title }}
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/sarif.py"

    - name: Complete check run
      if: always() && !cancelled() && steps.check.outputs.check-run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        USAGE_TEXT: ${{ steps.usage.outputs.usage-text }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        CHECK_RUN_ID: ${{ steps.check.outputs.check-run-id }}
        FINDINGS_FILE: ${{ steps.publish.outputs.findings-file }}
        SUMMARY_FILE: ${{ runner.temp }}/codex-review-summary.md
        FAIL_ON_PRIORITY: ${{ inputs.fail-on-priority }}
        EVENTS_FILE: ${{ runner.temp }}/codex-review-events.jsonl
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/checks.py" finish

    # A cancelled run is normally one a newer request superseded (the review job
    # cancels in progress per pull request), so its progress note is stale: it is
    # removed rather than left claiming a review is running, and the newer run
    # posts its own. No failure note goes up, because nothing failed.
    - name: Remove the progress note (cancelled)
      if: cancelled() && steps.status.outputs.status-comment-id != '' && steps.publish.outputs.posted != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        # No reaction: the request was not answered, the run that replaced this
        # one will answer it.
        TRIGGER_COMMENT_ID: ""
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" done

    - name: Cancel check run
      if: cancelled() && steps.check.outputs.check-run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CHECK_RUN_ID: ${{ steps.check.outputs.check-run-id }}
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/checks.py" cancel

    - name: Report failure on the PR
      if: failure() && steps.publish.outputs.posted != 'true' && inputs.post-mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_TITLE: ${{ inputs.title }}
        MODEL: ${{ steps.settings.outputs.model }}
        LABEL: ${{ steps.settings.outputs.label }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RERUN_HINT: ${{ inputs.rerun-hint }}
        STATUS_COMMENT_ID: ${{ steps.status.outputs.status-comment-id }}
        TRIGGER_COMMENT_ID: ${{ inputs.trigger-comment-id }}
        EVENTS_FILE: ${{ runner.temp }}/codex-review-events.jsonl
        ICONS: ${{ inputs.icons }}
        ICON_BASE_URL: ${{ inputs.icon-base-url }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/status.py" fail
