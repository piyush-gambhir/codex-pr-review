name: Codex review (reusable)


on:
  workflow_call:
    inputs:
      base-branches:
        description: "Comma-separated base branches that may be reviewed. Empty means the caller's default branch."
        type: string
        default: ""
      command:
        description: "Comment prefix that requests a review."
        type: string
        default: "@gpt review"
      skip-unchanged:
        description: "Skip the review when this commit already has a Codex review with the same settings; a note links to it instead. `@gpt review force` overrides it."
        type: boolean
        default: true
      label:
        description: "Label that requests a review when added to a pull request. Empty turns label triggers off."
        type: string
        default: codex-review
      remove-label:
        description: "Remove the label again after a label-triggered request, so it can be re-added to re-run."
        type: boolean
        default: true
      default-provider:
        description: "Provider when the request does not name one: `openai` or `bedrock`."
        type: string
        default: openai
      default-effort:
        description: "Reasoning effort when the request does not name one: low, medium, high or xhigh."
        type: string
        default: medium
      allowed-providers:
        description: "Comma-separated providers a request may choose."
        type: string
        default: openai,bedrock
      pr-number:
        description: "Pull request number for `workflow_dispatch` runs; pass the caller's own input through."
        type: string
        default: ""
      force:
        description: "Review even when the commit already has one, for triggers that carry no words of their own (a label, a manual run)."
        type: boolean
        default: false
      review-mode:
        description: "`single` (one pass over the diff), `full` (one pass per shard plus a cross-cutting pass, with the coverage measured) or `auto` (full over `max-changed-lines`). `@gpt review full` asks for a full review for one run."
        type: string
        default: single
      max-changed-lines:
        description: "Added plus deleted lines above which `review-mode: auto` reviews shard by shard. Empty means no limit."
        type: string
        default: ""
      shard-lines:
        description: "Changed lines per shard in a full review."
        type: string
        default: "2500"
      timeout-minutes:
        description: "Job timeout. A full review needs room for its passes: keep it above `review-budget-minutes` (20 by default) plus the install."
        type: number
        default: 30
      runs-on:
        description: "Runner label, or a JSON array of labels such as `[\"self-hosted\", \"linux\"]`."
        type: string
        default: ubuntu-24.04
      model:
        description: "Model ID. Empty picks the provider default."
        type: string
        default: ""
      aws-region:
        description: "AWS region for Bedrock."
        type: string
        default: us-east-1
      guidelines-path:
        description: "Review guidelines file, read from the caller's default branch. Empty loads none."
        type: string
        default: .github/codex-review.md
      max-priority:
        description: "Lowest priority to report: P0 to P3."
        type: string
        default: P3
      fail-on-priority:
        description: "Fail the review when a finding at this priority or higher is reported, e.g. `P1`."
        type: string
        default: ""
      fail-on-verdict:
        description: "Fail the review when the merge verdict is this or worse: `ready`, `nits`, `changes-requested` or `blocked`."
        type: string
        default: ""
      labels:
        description: "Label the pull request with the merge verdict (`codex: ready`, `codex: nits`, `codex: changes-requested`, `codex: blocked`). Needs `issues: write` from the caller."
        type: string
        default: "true"
      review-event:
        description: "How the review is submitted: `COMMENT`, `REQUEST_CHANGES`, or `auto` (request changes when the verdict asks for them)."
        type: string
        default: COMMENT
      icons:
        description: "Show the small Octicon images in the review. `false` renders every layout as text only, with no external images."
        type: string
        default: "true"
      icon-base-url:
        description: "Base URL the icon images are loaded from, without a trailing slash. Empty uses jsDelivr for the action's own repository."
        type: string
        default: ""
      app-client-id:
        description: "GitHub App client ID to post under your own bot name and avatar. Needs the CODEX_REVIEW_APP_PRIVATE_KEY secret."
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        description: "OpenAI API key, for the openai provider."
        required: false
      AWS_ROLE_TO_ASSUME:
        description: "IAM role ARN for the bedrock provider (GitHub OIDC)."
        required: false
      CODEX_REVIEW_APP_PRIVATE_KEY:
        description: "Private key of the GitHub App named by app-client-id."
        required: false
      ACTION_REPO_TOKEN:
        description: "Token that can read this workflow's own repository. Only needed for a private copy of it."
        required: false

jobs:
  trigger:
    name: Check request
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, inputs.command))
      || (github.event_name == 'pull_request' && github.event.label.name == inputs.label)
      || (github.event_name == 'pull_request_target' && github.event.label.name == inputs.label)
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      run: ${{ steps.trigger.outputs.run }}
      pr-number: ${{ steps.trigger.outputs.pr-number }}
      head-sha: ${{ steps.trigger.outputs.head-sha }}
      base-ref: ${{ steps.trigger.outputs.base-ref }}
      provider: ${{ steps.trigger.outputs.provider }}
      effort: ${{ steps.trigger.outputs.effort }}
      force: ${{ steps.trigger.outputs.force }}
      full: ${{ steps.trigger.outputs.full }}
      comment-id: ${{ steps.trigger.outputs.comment-id }}
      reason: ${{ steps.trigger.outputs.reason }}
    steps:
      - name: Checkout this workflow's own repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: codex-pr-review-action
          token: ${{ secrets.ACTION_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Parse the request and check the PR
        id: trigger
        uses: ./codex-pr-review-action/trigger
        with:
          command: ${{ inputs.command }}
          label: ${{ inputs.label }}
          remove-label: ${{ inputs.remove-label }}
          base-branches: ${{ inputs.base-branches }}
          default-provider: ${{ inputs.default-provider }}
          default-effort: ${{ inputs.default-effort }}
          allowed-providers: ${{ inputs.allowed-providers }}
          pr-number: ${{ inputs.pr-number }}
          force: ${{ inputs.force }}

  review:
    name: Codex review
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: codex-review-${{ needs.trigger.outputs.pr-number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Mint GitHub App token (optional custom bot identity)
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout this workflow's own repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: codex-pr-review-action
          token: ${{ secrets.ACTION_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout review guidelines from the default branch
        if: inputs.guidelines-path != ''
        uses: actions/checkout@v7
        with:
          path: trusted
          sparse-checkout: ${{ inputs.guidelines-path }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.trigger.outputs.head-sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Codex review (${{ needs.trigger.outputs.provider }}, ${{ needs.trigger.outputs.effort }})
        id: codex
        uses: ./codex-pr-review-action
        with:
          provider: ${{ needs.trigger.outputs.provider }}
          reasoning-effort: ${{ needs.trigger.outputs.effort }}
          model: ${{ inputs.model }}
          openai-api-key: ${{ needs.trigger.outputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          aws-role-to-assume: ${{ needs.trigger.outputs.provider == 'bedrock' && secrets.AWS_ROLE_TO_ASSUME || '' }}
          aws-region: ${{ inputs.aws-region }}
          base-ref: ${{ needs.trigger.outputs.base-ref }}
          working-directory: pr
          pr-number: ${{ needs.trigger.outputs.pr-number }}
          head-sha: ${{ needs.trigger.outputs.head-sha }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          trigger-comment-id: ${{ needs.trigger.outputs.comment-id }}
          skip-unchanged: ${{ inputs.skip-unchanged }}
          force: ${{ needs.trigger.outputs.force }}
          review-mode: ${{ needs.trigger.outputs.full == 'true' && 'full' || inputs.review-mode }}
          max-changed-lines: ${{ inputs.max-changed-lines }}
          shard-lines: ${{ inputs.shard-lines }}
          rerun-hint: "Re-run: `${{ inputs.command }}` \u00b7 same commit again: `${{ inputs.command }} force` \u00b7 deeper: `${{ inputs.command }} high` \u00b7 every file: `${{ inputs.command }} full` \u00b7 on Bedrock: `${{ inputs.command }} bedrock`"
          review-instructions-file: ${{ inputs.guidelines-path != '' && hashFiles(format('trusted/{0}', inputs.guidelines-path)) != '' && format('trusted/{0}', inputs.guidelines-path) || '' }}
          max-priority: ${{ inputs.max-priority }}
          fail-on-priority: ${{ inputs.fail-on-priority }}
          fail-on-verdict: ${{ inputs.fail-on-verdict }}
          labels: ${{ inputs.labels }}
          review-event: ${{ inputs.review-event }}
          icons: ${{ inputs.icons }}
          icon-base-url: ${{ inputs.icon-base-url }}

      - name: Report
        if: always() && steps.codex.outputs.findings-count != ''
        env:
          COUNT: ${{ steps.codex.outputs.findings-count }}
          HIGHEST: ${{ steps.codex.outputs.highest-priority }}
          VERDICT: ${{ steps.codex.outputs.verdict }}
          HEALTH: ${{ steps.codex.outputs.health-score }}
          CONFIDENCE: ${{ steps.codex.outputs.confidence }}
          MODE: ${{ steps.codex.outputs.review-mode }}
          INSPECTED: ${{ steps.codex.outputs.coverage-files-inspected }}
          TOTAL: ${{ steps.codex.outputs.coverage-files-total }}
        run: |
          echo "Codex reported $COUNT finding(s), highest ${HIGHEST:-none}."
          echo "Verdict: ${VERDICT:-unknown}, health ${HEALTH:--}/100, ${CONFIDENCE:-unknown} confidence."
          echo "Mode ${MODE:-single}, inspected ${INSPECTED:-?}/${TOTAL:-?} changed files."
