name: Codex review (reusable)

# Trigger plus review in one call, so a consuming repository only needs:
#
#   on:
#     issue_comment: { types: [created] }
#     pull_request: { types: [labeled] }
#   jobs:
#     codex:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         id-token: write
#       uses: piyush-gambhir/codex-pr-review/.github/workflows/review.yml@v1
#       with: { base-branches: main }
#       secrets: inherit
#
# Callers must grant those permissions: a called workflow can only downgrade the
# caller's GITHUB_TOKEN, never widen it, so anything the caller withholds is
# simply missing here (id-token is only needed for the bedrock provider).
#
# Referencing this repository's own action at the ref the caller asked for:
# `github.workflow_ref` and `github.workflow_sha` describe the *caller's*
# workflow, and `./` resolves against the caller's checkout, so neither can name
# the action that belongs with this file. The `job.workflow_*` contexts do: they
# describe the workflow file defining the running job, which is this file. Every
# job below therefore checks out `job.workflow_repository` at `job.workflow_sha`
# and uses the action from that checkout, so `@v1.1.0` of this workflow runs
# v1.1.0 of the action, a full-SHA pin runs that SHA, and a private copy of this
# repository uses itself instead of the public one.
# Trade-offs: `job.workflow_*` is not available on GitHub Enterprise Server (use
# `examples/codex-review-standalone.yml` there), and a private copy needs the
# `ACTION_REPO_TOKEN` secret, since the caller's GITHUB_TOKEN cannot read
# another private repository. The newer `$/` self-repository syntax would remove
# the checkout, but it is documented only for same-repository references, so it
# is not usable from a workflow called by another repository yet.

on:
  workflow_call:
    inputs:
      base-branches:
        description: "Comma-separated base branches that may be reviewed. Empty means the caller's default branch."
        type: string
        default: ""
      command:
        description: "Comment prefix that requests a review."
        type: string
        default: "@gpt review"
      label:
        description: "Label that requests a review when added to a pull request. Empty turns label triggers off."
        type: string
        default: codex-review
      remove-label:
        description: "Remove the label again after a label-triggered request, so it can be re-added to re-run."
        type: boolean
        default: true
      default-provider:
        description: "Provider when the request does not name one: `openai` or `bedrock`."
        type: string
        default: openai
      default-effort:
        description: "Reasoning effort when the request does not name one: low, medium, high or xhigh."
        type: string
        default: medium
      allowed-providers:
        description: "Comma-separated providers a request may choose."
        type: string
        default: openai,bedrock
      pr-number:
        description: "Pull request number for `workflow_dispatch` runs; pass the caller's own input through."
        type: string
        default: ""
      runs-on:
        description: "Runner label, or a JSON array of labels such as `[\"self-hosted\", \"linux\"]`."
        type: string
        default: ubuntu-24.04
      model:
        description: "Model ID. Empty picks the provider default."
        type: string
        default: ""
      aws-region:
        description: "AWS region for Bedrock."
        type: string
        default: us-east-1
      guidelines-path:
        description: "Review guidelines file, read from the caller's default branch. Empty loads none."
        type: string
        default: .github/codex-review.md
      max-priority:
        description: "Lowest priority to report: P0 to P3."
        type: string
        default: P3
      fail-on-priority:
        description: "Fail the review when a finding at this priority or higher is reported, e.g. `P1`."
        type: string
        default: ""
      app-id:
        description: "GitHub App ID to post under your own bot name and avatar. Needs the CODEX_REVIEW_APP_PRIVATE_KEY secret."
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        description: "OpenAI API key, for the openai provider."
        required: false
      AWS_ROLE_TO_ASSUME:
        description: "IAM role ARN for the bedrock provider (GitHub OIDC)."
        required: false
      CODEX_REVIEW_APP_PRIVATE_KEY:
        description: "Private key of the GitHub App named by app-id."
        required: false
      ACTION_REPO_TOKEN:
        description: "Token that can read this workflow's own repository. Only needed for a private copy of it."
        required: false

jobs:
  trigger:
    name: Check request
    # Cheap gate so stray comments never start a runner. The script checks the
    # same things again (a little more forgivingly: it ignores leading blanks).
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, inputs.command))
      || (github.event_name == 'pull_request' && github.event.label.name == inputs.label)
      || (github.event_name == 'pull_request_target' && github.event.label.name == inputs.label)
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
      # Comments on a PR are pull-request resources: reacting to or replying on
      # them needs pull-requests: write.
      pull-requests: write
      issues: write
    outputs:
      run: ${{ steps.trigger.outputs.run }}
      pr-number: ${{ steps.trigger.outputs.pr-number }}
      head-sha: ${{ steps.trigger.outputs.head-sha }}
      base-ref: ${{ steps.trigger.outputs.base-ref }}
      provider: ${{ steps.trigger.outputs.provider }}
      effort: ${{ steps.trigger.outputs.effort }}
      comment-id: ${{ steps.trigger.outputs.comment-id }}
      reason: ${{ steps.trigger.outputs.reason }}
    steps:
      - name: Checkout this workflow's own repository
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: codex-pr-review-action
          token: ${{ secrets.ACTION_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Parse the request and check the PR
        id: trigger
        uses: ./codex-pr-review-action/trigger
        with:
          command: ${{ inputs.command }}
          label: ${{ inputs.label }}
          remove-label: ${{ inputs.remove-label }}
          base-branches: ${{ inputs.base-branches }}
          default-provider: ${{ inputs.default-provider }}
          default-effort: ${{ inputs.default-effort }}
          allowed-providers: ${{ inputs.allowed-providers }}
          pr-number: ${{ inputs.pr-number }}

  review:
    name: Codex review
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 30
    concurrency:
      group: codex-review-${{ needs.trigger.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # post the review
      id-token: write # AWS OIDC (bedrock provider)
    steps:
      - name: Mint GitHub App token (optional custom bot identity)
        id: app
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout this workflow's own repository
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: codex-pr-review-action
          token: ${{ secrets.ACTION_REPO_TOKEN || github.token }}
          persist-credentials: false

      # Review guidelines come from the default branch, so a PR can't rewrite
      # the rules it is reviewed against.
      - name: Checkout review guidelines from the default branch
        if: inputs.guidelines-path != ''
        uses: actions/checkout@v6
        with:
          path: trusted
          sparse-checkout: ${{ inputs.guidelines-path }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.trigger.outputs.head-sha }}
          path: pr
          fetch-depth: 0 # the review diffs against the merge base with the base branch
          persist-credentials: false

      - name: Codex review (${{ needs.trigger.outputs.provider }}, ${{ needs.trigger.outputs.effort }})
        id: codex
        uses: ./codex-pr-review-action
        with:
          provider: ${{ needs.trigger.outputs.provider }}
          reasoning-effort: ${{ needs.trigger.outputs.effort }}
          model: ${{ inputs.model }}
          openai-api-key: ${{ needs.trigger.outputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          aws-role-to-assume: ${{ needs.trigger.outputs.provider == 'bedrock' && secrets.AWS_ROLE_TO_ASSUME || '' }}
          aws-region: ${{ inputs.aws-region }}
          base-ref: ${{ needs.trigger.outputs.base-ref }}
          working-directory: pr
          pr-number: ${{ needs.trigger.outputs.pr-number }}
          head-sha: ${{ needs.trigger.outputs.head-sha }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          trigger-comment-id: ${{ needs.trigger.outputs.comment-id }}
          rerun-hint: "Re-run: `${{ inputs.command }}` \u00b7 deeper: `${{ inputs.command }} high` \u00b7 on Bedrock: `${{ inputs.command }} bedrock`"
          # Guidelines are optional: the file may not exist in the caller's repo.
          review-instructions-file: ${{ inputs.guidelines-path != '' && hashFiles(format('trusted/{0}', inputs.guidelines-path)) != '' && format('trusted/{0}', inputs.guidelines-path) || '' }}
          max-priority: ${{ inputs.max-priority }}
          fail-on-priority: ${{ inputs.fail-on-priority }}

      - name: Report
        if: always() && steps.codex.outputs.findings-count != ''
        env:
          COUNT: ${{ steps.codex.outputs.findings-count }}
          HIGHEST: ${{ steps.codex.outputs.highest-priority }}
        run: echo "Codex reported $COUNT finding(s), highest ${HIGHEST:-none}."
