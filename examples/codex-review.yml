name: Codex PR Review

# On-demand review. Comment on an open PR that targets BASE_BRANCH:
#
#   @gpt review                  default provider and effort
#   @gpt review high             more reasoning for this request
#   @gpt review bedrock          run on Amazon Bedrock this time
#   @gpt review openai xhigh     provider and effort together
#
# The command must start the comment. Nothing runs on open or push.
# Defaults come from repository variables CODEX_REVIEW_PROVIDER (openai) and
# CODEX_REVIEW_EFFORT (medium).
#
# Optional: post as your own bot (name and avatar) instead of github-actions,
# using a GitHub App (see README). Set repository variable CODEX_REVIEW_APP_ID
# and secret CODEX_REVIEW_APP_PRIVATE_KEY; without them GITHUB_TOKEN is used.
#
# Credentials:
#   openai:  Actions secret OPENAI_API_KEY.
#   bedrock: an IAM role trusted for repo:OWNER/REPO:ref:refs/heads/<default
#            branch> via GitHub OIDC that can invoke the model; Actions secret
#            AWS_ROLE_TO_ASSUME with its ARN.

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  BASE_BRANCH: main

jobs:
  gate:
    name: Check request
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '@gpt review')
    runs-on: ubuntu-24.04
    permissions:
      # Comments on a PR are pull-request resources: reacting to or replying
      # on them needs pull-requests: write.
      pull-requests: write
      issues: write
    outputs:
      run: ${{ steps.check.outputs.run }}
      head-sha: ${{ steps.check.outputs.head-sha }}
      provider: ${{ steps.check.outputs.provider }}
      effort: ${{ steps.check.outputs.effort }}
    steps:
      - name: Parse the request and check the PR
        id: check
        uses: actions/github-script@v8
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          DEFAULT_PROVIDER: ${{ vars.CODEX_REVIEW_PROVIDER || 'openai' }}
          DEFAULT_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT || 'medium' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = process.env.BASE_BRANCH;
            core.setOutput('run', 'false');

            // Words after "@gpt review" on the first line choose provider and effort.
            const providers = ['openai', 'bedrock'];
            const efforts = ['low', 'medium', 'high', 'xhigh'];
            let provider = process.env.DEFAULT_PROVIDER;
            let effort = process.env.DEFAULT_EFFORT;
            const words = context.payload.comment.body.split('\n')[0].trim().split(/\s+/).slice(2);
            for (const word of words.map((w) => w.toLowerCase())) {
              if (providers.includes(word)) provider = word;
              else if (efforts.includes(word)) effort = word;
              else {
                core.notice(`Ignoring unknown option '${word}'.`);
              }
            }
            if (!providers.includes(provider) || !efforts.includes(effort)) {
              core.notice(`Invalid defaults: provider '${provider}', effort '${effort}'.`);
              return;
            }

            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              core.notice(`${context.actor} lacks write access; ignoring.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (pr.state !== 'open') return;
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.notice('Fork PRs are not reviewed: the review job holds model credentials.');
              return;
            }
            if (pr.base.ref !== base) {
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `Codex review only runs on PRs targeting \`${base}\` (this PR targets \`${pr.base.ref}\`).`,
                });
              } catch (err) {
                core.warning(`Could not post the base-branch reply: ${err.message}`);
              }
              return;
            }

            core.setOutput('run', 'true');
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('provider', provider);
            core.setOutput('effort', effort);

            // Acknowledge the request; best effort only.
            try {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
              });
            } catch (err) {
              core.warning(`Could not add the eyes reaction: ${err.message}`);
            }

  review:
    name: Codex review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: codex-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # post the review
      id-token: write # AWS OIDC (bedrock provider)
      # checks: write         # uncomment together with check-run below
      # security-events: write # uncomment to upload SARIF to code scanning
    steps:
      - name: Mint GitHub App token (optional custom bot identity)
        id: app
        if: vars.CODEX_REVIEW_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODEX_REVIEW_APP_ID }}
          private-key: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      # Review guidelines come from the default branch, so a PR can't rewrite
      # the rules it is reviewed against.
      - name: Checkout review guidelines from the default branch
        uses: actions/checkout@v6
        with:
          path: trusted
          sparse-checkout: .github/codex-review.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head-sha }}
          path: pr
          fetch-depth: 0 # the review diffs against the merge base with BASE_BRANCH
          persist-credentials: false

      - name: Codex review (${{ needs.gate.outputs.provider }}, ${{ needs.gate.outputs.effort }})
        id: codex
        uses: piyush-gambhir/codex-pr-review@v1
        with:
          provider: ${{ needs.gate.outputs.provider }}
          reasoning-effort: ${{ needs.gate.outputs.effort }}
          openai-api-key: ${{ needs.gate.outputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          aws-role-to-assume: ${{ needs.gate.outputs.provider == 'bedrock' && secrets.AWS_ROLE_TO_ASSUME || '' }}
          base-ref: origin/${{ env.BASE_BRANCH }}
          working-directory: pr
          pr-number: ${{ github.event.issue.number }}
          head-sha: ${{ needs.gate.outputs.head-sha }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          trigger-comment-id: ${{ github.event.comment.id }}
          rerun-hint: "Re-run: `@gpt review` \u00b7 deeper: `@gpt review high` \u00b7 on Bedrock: `@gpt review bedrock`"
          # Optional: repository-specific guidelines (file may not exist).
          review-instructions-file: ${{ hashFiles('trusted/.github/codex-review.md') != '' && 'trusted/.github/codex-review.md' || '' }}
          max-priority: P3
          # fail-on-priority: P1   # uncomment to fail the check on P0/P1 findings
          # Optional extras, each needing the permission noted above:
          #   check-run: true             # check run with annotations (checks: write)
          #   sarif-file: codex-review.sarif  # then upload it with the step below

      # - name: Upload the findings to code scanning
      #   if: always() && steps.codex.outputs.sarif-file != ''
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.codex.outputs.sarif-file }}
      #     checkout_path: ${{ github.workspace }}/pr
      #     category: codex-review

      - name: Report
        if: always() && steps.codex.outputs.findings-count != ''
        env:
          COUNT: ${{ steps.codex.outputs.findings-count }}
          HIGHEST: ${{ steps.codex.outputs.highest-priority }}
        run: echo "Codex reported $COUNT finding(s), highest ${HIGHEST:-none}."
