name: Codex PR Review


on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request to review
        required: true

permissions: {}

jobs:
  codex:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: piyush-gambhir/codex-pr-review/.github/workflows/review.yml@v1
    with:
      base-branches: main
      pr-number: ${{ inputs.pr-number }}
    secrets: inherit
