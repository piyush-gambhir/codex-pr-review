name: Codex PR Review

# On-demand review, three ways:
#
#   comment  @gpt review              default provider and effort
#            @gpt review high         more reasoning for this request
#            @gpt review bedrock      run on Amazon Bedrock this time
#            @gpt review openai xhigh provider and effort together
#            @gpt review force        review this commit again even if it has
#                                     a review with the same settings
#   label    add the `codex-review` label (it comes off again, so re-adding
#            it re-runs the review)
#   manual   Actions tab -> this workflow -> Run workflow -> PR number
#
# Nothing runs on open or push, so you only pay for reviews someone asks for.
# Copy this file to .github/workflows/codex-review.yml on your default branch
# (comment-triggered workflows only run from there).
#
# Credentials:
#   openai:  Actions secret OPENAI_API_KEY.
#   bedrock: an IAM role trusted for repo:OWNER/REPO:ref:refs/heads/<default
#            branch> via GitHub OIDC that can invoke the model; Actions secret
#            AWS_ROLE_TO_ASSUME with its ARN.
#
# For full control over the gate and the checkouts, copy
# `examples/codex-review-standalone.yml` instead.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request to review
        required: true

permissions: {}

jobs:
  codex:
    permissions:
      contents: read
      pull-requests: write # post the review, react and reply
      issues: write # react to the requesting comment
      id-token: write # AWS OIDC, for the bedrock provider
    uses: piyush-gambhir/codex-pr-review/.github/workflows/review.yml@v1
    with:
      base-branches: main
      pr-number: ${{ inputs.pr-number }}
      # label: codex-review
      # default-provider: openai
      # default-effort: medium
      # skip-unchanged: false  # uncomment to review again even when nothing changed
      # force: true            # uncomment to make label and manual runs always review
      # max-priority: P3
      # fail-on-priority: P1   # uncomment to fail the check on P0/P1 findings
      # app-client-id: ${{ vars.CODEX_REVIEW_APP_CLIENT_ID }}   # post as your own bot
    secrets: inherit
